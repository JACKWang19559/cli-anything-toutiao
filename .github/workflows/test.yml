name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.12']
    env:
      CLI_ANYTHING_FORCE_INSTALLED: '1'
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
      - name: Install CLI and test dependencies
        run: python -m pip install -e "./agent-harness[dev]" build
      - name: Test installed CLI (offline)
        run: python -m pytest agent-harness/cli_anything/toutiao/tests -v --tb=short
      - name: Build wheel
        run: python -m build --wheel --outdir dist agent-harness
